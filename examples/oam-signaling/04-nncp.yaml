# NNCP for the OAM/signaling example.
#
# Configures:
# - egressip-dummy: dummy interface for EgressIP address assignment.
#   OVN binds EgressIP addresses to the node that has an interface with an
#   IP in the same subnet. The dummy interface hosts this subnet (10.99.0.0/24)
#   so that EgressIP addresses don't need to be on the actual egress interfaces.
# - oam-host, sig-host: alternate interfaces with host IPs and /32 SNAT IPs
# - Static routes for destination-based routing to alternate interfaces
# - Catch-all ip rule at priority 5550 to route all traffic via the main table
#   before OVN's EgressIP rule (priority 6000)
---
apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: egress-multinic-oam-sig
spec:
  nodeSelector:
    k8s.ovn.org/egress-assignable: ""
  desiredState:
    interfaces:
      - name: egressip-dummy
        type: dummy
        state: up
        ipv4:
          enabled: true
          dhcp: false
          address:
            - ip: 10.99.0.1
              prefix-length: 24
        ipv6:
          enabled: false

      - name: oam-host
        type: veth
        state: up
        ipv4:
          enabled: true
          dhcp: false
          address:
            - ip: 192.168.150.10
              prefix-length: 24
            - ip: 192.168.150.200
              prefix-length: 32
        ipv6:
          enabled: false

      - name: sig-host
        type: veth
        state: up
        ipv4:
          enabled: true
          dhcp: false
          address:
            - ip: 192.168.200.10
              prefix-length: 24
            - ip: 192.168.200.200
              prefix-length: 32
        ipv6:
          enabled: false

    routes:
      config:
        - destination: 192.168.250.0/24
          next-hop-address: 192.168.150.1
          next-hop-interface: oam-host
        - destination: 192.168.251.0/24
          next-hop-address: 192.168.200.1
          next-hop-interface: sig-host

    route-rules:
      config:
        - family: ipv4
          route-table: 254
          priority: 5550
