# EgressIP bound to the egressip-dummy interface (10.99.0.0/24 subnet).
# The EgressIP address is on the dummy interface -- it only serves as a
# selector to associate pods with this EgressIP CR. Actual routing is
# handled by the catch-all ip rule (priority 5550) and main table static
# routes. SNAT is handled by our nftables rules (/32 IPs on alternate
# interfaces) or masquerade for br-ex traffic.
#
# Selects only pods with label app=demo via podSelector.
---
apiVersion: k8s.ovn.org/v1
kind: EgressIP
metadata:
  name: egressip-oam
spec:
  egressIPs:
    - 10.99.0.100
  namespaceSelector:
    matchLabels:
      egress-group: oam-sig
  podSelector:
    matchLabels:
      app: demo
