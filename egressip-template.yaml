# EgressIP template.
#
# The EgressIP address must be in the egressip-dummy subnet (e.g., 10.99.0.0/24)
# configured via NNCP on the gateway nodes. OVN binds the EgressIP to the node
# with an interface in this subnet.
#
# The EgressIP address serves only as a pod selector mechanism. Actual routing
# is handled by the catch-all ip rule (priority 5550) and main table static
# routes. SNAT is handled by our nftables rules (/32 IPs on alternate
# interfaces) or masquerade for br-ex traffic.
---
apiVersion: k8s.ovn.org/v1
kind: EgressIP
metadata:
  name: <EGRESSIP_NAME>
spec:
  egressIPs:
    - <EGRESSIP_ADDRESS>       # must be in the egressip-dummy subnet (e.g., 10.99.0.100)
  namespaceSelector:
    matchLabels:
      <LABEL_KEY>: <LABEL_VALUE>
