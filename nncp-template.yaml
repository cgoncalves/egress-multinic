# NodeNetworkConfigurationPolicy template for alternate interfaces.
#
# Configures per-node:
# - egressip-dummy: dummy interface for EgressIP address assignment. OVN binds
#   EgressIP addresses to the node with an interface in the same subnet. The
#   dummy hosts this subnet so EgressIP addresses don't need to be on the actual
#   egress interfaces. All gateway nodes share the same dummy subnet.
# - Alternate interface IPs (/24) for connectivity and /32 SNAT IPs
# - Static routes for destination-based routing
# - Catch-all IP routing policy rule (priority 5550) to route all traffic via
#   the main table before OVN's EgressIP rule (priority 6000)
#
# Create one NNCP per gateway node so that each node can have its own /32 SNAT
# IP addresses. Adjust interface names, IP addresses, routes, and node
# selector to match your environment.
#
# Note: use type "veth" for veth-pair interfaces (e.g., test environments) and
# type "ethernet" for physical NICs.
---
apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: egress-multinic-node1
spec:
  nodeSelector:
    kubernetes.io/hostname: gateway-node1.example.com
  desiredState:
    interfaces:
      - name: egressip-dummy
        type: dummy
        state: up
        ipv4:
          enabled: true
          dhcp: false
          address:
            - ip: <DUMMY_IP>       # e.g., 10.99.0.1 (same subnet on all gateway nodes)
              prefix-length: 24
        ipv6:
          enabled: false

      - name: <INTERFACE_1>
        type: ethernet
        state: up
        ipv4:
          enabled: true
          dhcp: false
          address:
            - ip: <HOST_IP_1>
              prefix-length: 24
            - ip: <SNAT_IP_1>
              prefix-length: 32
        ipv6:
          enabled: false

    routes:
      config:
        - destination: <DEST_CIDR_1>
          next-hop-address: <GATEWAY_IP_1>
          next-hop-interface: <INTERFACE_1>

    route-rules:
      config:
        - family: ipv4
          route-table: 254
          priority: 5550
